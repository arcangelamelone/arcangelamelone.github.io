<script>
   const sliderContainer = document.querySelector('.slider-container');
    const slider = document.querySelector('.slider');
    const prevButton = document.querySelector('.slider-prev');
    const nextButton = document.querySelector('.slider-next');
    const items = [
        {href: "segno/ariete/index.html", img: "ariete.png", text: "ARIETE"},
        {href: "segno/toro/index.html", img: "toro.png", text: "TORO"},
        {href: "segno/gemelli/index.html", img: "gemelli.png", text: "GEMELLI"},
        {href: "segno/cancro/index.html", img: "cancro.png", text: "CANCRO"},
        {href: "segno/leone/index.html", img: "leone.png", text: "LEONE"},
        {href: "segno/vergine/index.html", img: "vergine.png", text: "VERGINE"},
        {href: "segno/bilancia/index.html", img: "bilancia.png", text: "BILANCIA"},
        {href: "segno/scorpione/index.html", img: "scorpione.png", text: "SCORPIONE"},
        {href: "segno/sagittario/index.html", img: "sagittario.png", text: "SAGITTARIO"},
        {href: "segno/capricorno/index.html", img: "capricorno.png", text: "CAPRICORNO"},
        {href: "segno/aquario/index.html", img: "aquario.png", text: "AQUARIO"},
        {href: "segno/pesci/index.html", img: "pesci.png", text: "PESCI"},
    ];
    items.forEach(item=>{
        slider.innerHTML += `<a href="${item.href}" class="slider-item">
            <div class="segno">
                <img src="${item.img}" width="200px">
                <div class="overlay">
                    <div class="text">${item.text}</div>
                </div>
                <p class="segnonascosto">${item.text}</p>
            </div>
        </a>`;
    })
    let currentPosition = 0;
    let scrollAmount = 200;

    function updateSlider() {
        slider.style.transform = `translateX(-${currentPosition}px)`;
        prevButton.style.display = currentPosition <= 0 ? 'none' : 'block';
        nextButton.style.display = currentPosition >= slider.scrollWidth - sliderContainer.offsetWidth ? 'none' : 'block';
    }

    nextButton.addEventListener('click', () => {
        currentPosition += scrollAmount;
        updateSlider();
    });

    prevButton.addEventListener('click', () => {
        currentPosition -= scrollAmount;
        updateSlider();
    });
    window.addEventListener('resize', updateSlider);
    updateSlider();



    const oroscopoMenu = document.getElementById('oroscopo-menu');
    const sottomenu = oroscopoMenu.querySelector('.contenutimenuoroscopo');

    oroscopoMenu.addEventListener('click', function(event) {
        event.preventDefault(); // Impedisce il comportamento predefinito del link (se presente)
        sottomenu.style.display = sottomenu.style.display === 'block' ? 'none' : 'block';
    });

    sottomenu.addEventListener('click', function(event) {
    if (event.target.classList.contains('mese') || event.target.classList.contains('anno')) {
        event.stopPropagation(); // ESSENZIALE: Impedisce la propagazione al contenitore
        // Ora il link funzionerà automaticamente perché non c'è più preventDefault qui per i link del sottomenu.
    }
});
</script>
