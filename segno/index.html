<script>
  function zodiac() {
      var mese = parseInt(document.getElementById("mese").value);
      var giorno = parseInt(document.getElementById("giorno").value);
      var result = "Se non inserisci la data non sapremo mai qual'è il tuo segno. &#128335";

      // Verifica che mese e giorno siano numeri validi
      if (isNaN(mese) || isNaN(giorno) || mese < 1 || mese > 12 || giorno < 1 || giorno > 31) {
          alert("Per favore inserisci una data valida.");
          return; // Esce dalla funzione se la data non è valida
      }


      if ((mese == 1 && giorno >= 20) || (mese == 2 && giorno <= 18)) {
          result = "Aquario";
          setImage("aquario.png", "#cc99cc");
          createLink("aquario/index.html");
      } else if ((mese == 2 && giorno >= 19) || (mese == 3 && giorno <= 20)) {
          result = "Pesci";
          setImage("pesci.png", "#6633ff");
          createLink("pesci/index.html");
      } else if ((mese == 3 && giorno >= 21) || (mese == 4 && giorno <= 19)) {
          result = "Ariete";
          setImage("ariete.png", "#ff6633");
          createLink("ariete/index.html");
      } else if ((mese == 4 && giorno >= 20) || (mese == 5 && giorno <= 20)) {
          result = "Toro";
          setImage("toro.png", "#ffcc66");
          createLink("toro/index.html");
      } else if ((mese == 5 && giorno >= 21) || (mese == 6 && giorno <= 20)) {
          result = "Gemelli";
          setImage("gemelli.png", "#cc99cc");
          createLink("gemelli/index.html");
      } else if ((mese == 6 && giorno >= 21) || (mese == 7 && giorno <= 22)) {
          result = "Cancro";
          setImage("cancro.png", "#6633ff");
          createLink("cancro/index.html");
      } else if ((mese == 7 && giorno >= 23) || (mese == 8 && giorno <= 22)) {
          result = "Leone";
          setImage("leone.png", "#ff6633");
          createLink("leone/index.html");
      } else if ((mese == 8 && giorno >= 23) || (mese == 9 && giorno <= 22)) {
          result = "Vergine";
          setImage("vergine.png", "#ffcc66");
          createLink("vergine/index.html");
      } else if ((mese == 9 && giorno >= 23) || (mese == 10 && giorno <= 22)) {
          result = "Bilancia";
          setImage("bilancia.png", "#cc99cc");
          createLink("bilancia/index.html");
      } else if ((mese == 10 && giorno >= 23) || (mese == 11 && giorno <= 21)) {
          result = "Scorpione";
          setImage("scorpione.png", "#6633ff");
          createLink("scorpione/index.html");
      } else if ((mese == 11 && giorno >= 22) || (mese == 12 && giorno <= 21)) {
          result = "Sagittario";
          setImage("sagittario.png", "#ff6633");
          createLink("sagittario/index.html");
      } else if ((mese == 12 && giorno >= 22) || (mese == 1 && giorno <= 19)) {
          result = "Capricorno";
          setImage("capricorno.png", "#ffcc66");
          createLink("capricorno/index.html");
      }

      document.getElementById("output").innerHTML = result;
            document.getElementById("space").style.display = "block"; // Mostra #space
        
  }

  function setImage(imagePath, color) {
      document.getElementById("photo").innerHTML = "<img src='" + imagePath + "' width='16%'>";
      document.getElementById("output").style.color = color;
      document.getElementById("output").style.fontSize = "24pt";
      document.getElementById("output").style.fontWeight = "bold";
  }

  function createLink(linkPath) {
      var a = document.createElement('a');
      a.className = 'scopri';
      var link = document.createTextNode("Scopri");
      a.appendChild(link);
      a.href = linkPath;
      a.style.textDecoration = "none";
      document.getElementById("empty").innerHTML = ""; // Pulisce il link precedente
      document.getElementById("empty").appendChild(a);
  }

  const oroscopoMenu = document.getElementById('oroscopo-menu');
    const sottomenu = oroscopoMenu.querySelector('.contenutimenuoroscopo');

    oroscopoMenu.addEventListener('click', function(event) {
        event.preventDefault(); // Impedisce il comportamento predefinito del link (se presente)
        sottomenu.style.display = sottomenu.style.display === 'block' ? 'none' : 'block';
    });

    sottomenu.addEventListener('click', function(event) {
    if (event.target.classList.contains('mese') || event.target.classList.contains('anno')) {
        event.stopPropagation(); // ESSENZIALE: Impedisce la propagazione al contenitore
        // Ora il link funzionerà automaticamente perché non c'è più preventDefault qui per i link del sottomenu.
    }
});

</script>
